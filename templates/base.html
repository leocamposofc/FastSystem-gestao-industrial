<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo_documento %}FastSystem{% endblock %} | FastSystem</title>

    <style>
        :root {
            --fs-grafite: #292d30;
            --fs-amarelo: #f4c430;
            --fs-fundo: #eceeef;
            --fs-texto: #25292c;
            --fs-branco: #fff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--fs-fundo);
            color: var(--fs-texto);
            font-family: Arial, Helvetica, sans-serif;
        }
        .fs-topbar {
            width: 100%;
            min-height: 76px;
            background: var(--fs-grafite);
            border-bottom: 4px solid var(--fs-amarelo);
            color: var(--fs-branco);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 12px clamp(18px, 4vw, 54px);
            box-shadow: 0 3px 12px rgba(0,0,0,.14);
        }
        .fs-brand-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: inherit;
            text-decoration: none;
            flex-shrink: 0;
            border-radius: 6px;
            transition: opacity .2s ease, transform .2s ease;
        }
        .fs-brand-link:hover { opacity: .88; transform: translateY(-1px); }
        .fs-brand-link:focus-visible {
            outline: 2px solid var(--fs-amarelo);
            outline-offset: 5px;
        }
        .fs-brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            background: var(--fs-amarelo);
            color: var(--fs-grafite);
            border-radius: 7px;
            font-size: 22px;
            line-height: 1;
            font-weight: 900;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
        }
        .fs-brand-name {
            display: block;
            font-size: 19px;
            line-height: 1.1;
            letter-spacing: 1.4px;
            font-weight: 800;
        }
        .fs-brand-subtitle {
            display: block;
            margin-top: 4px;
            color: #c4c8ca;
            font-size: 9px;
            line-height: 1;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .fs-page-context { min-width: 0; text-align: right; }
        .fs-page-section {
            display: block;
            margin-bottom: 5px;
            color: #b9bec1;
            font-size: 10px;
            line-height: 1.2;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .fs-page-name {
            display: block;
            color: var(--fs-branco);
            font-size: 16px;
            line-height: 1.25;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .fs-main {
            width: min(1440px, 100%);
            margin: 0 auto;
            padding: 28px clamp(16px, 3vw, 38px) 48px;
        }
        @media (max-width: 560px) {
            .fs-topbar { min-height: 68px; padding: 10px 15px; gap: 12px; }
            .fs-brand-mark { width: 38px; height: 38px; font-size: 26px; }
            .fs-brand-name { font-size: 16px; }
            .fs-brand-subtitle { font-size: 8px; letter-spacing: 1.4px; }
            .fs-page-section { font-size: 8px; letter-spacing: 1px; }
            .fs-page-name { font-size: 13px; }
            .fs-main { padding: 20px 12px 36px; }
        }
        @media print {
            .fs-topbar {
                box-shadow: none;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            .fs-main { width: 100%; padding: 18px 0; }
        }
    </style>

{% include '/popup.html' %}



    {% block head %}{% endblock %}
</head>
<body>
    <header class="fs-topbar">
        <!-- Se sua rota inicial não se chama 'index', ajuste o endpoint abaixo. -->
        <a class="fs-brand-link"
           href="{{ url_for('inicio') }}"
           title="Voltar ao menu inicial"
           aria-label="FastSystem - voltar ao menu inicial">
            <span class="fs-brand-mark">F</span>
            <span>
                <span class="fs-brand-name">FASTSYSTEM</span>
                <span class="fs-brand-subtitle">GESTÃO INDUSTRIAL</span>
            </span>
        </a>

        <div class="fs-page-context" aria-live="polite">
            <span class="fs-page-section">{% block secao_pagina %}SISTEMA{% endblock %}</span>
            <span class="fs-page-name">{% block pagina_atual %}Início{% endblock %}</span>
        </div>
    </header>

    <main class="fs-main">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>

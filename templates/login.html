
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FastSystem</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #292d30;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: #373d41;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0,0,0,.3);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #f4c430;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitulo {
            text-align: center;
            color: #bbb;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #292d30;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #f4c430;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #f4c430;
            color: #292d30;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #d5a900;
        }

        .mensagem {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #633b3b;
            color: #fff;
            font-size: 13px;
        }

        .rodape {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">F</div>

        <h2>FastSystem</h2>

        <div class="subtitulo">
            Gestão Industrial
        </div>

        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <div class="mensagem">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                ENTRAR NO SISTEMA
            </button>

        </form>

        <div class="rodape">
            FastSystem - Gestão Industrial
        </div>

    </div>

</body>
</html>

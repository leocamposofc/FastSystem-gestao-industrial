<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Calculadora de Orçamentos</title>
</head>
<body>
<h2>Selecionar Cliente</h2>
<form method="post" action="/emitir_orcamento">
    <label>Cliente:</label>
    <select name="cliente" required>
        {% for id, nome in clientes %}
        <option value="{{ id }}">{{ nome }}</option>
        {% endfor %}
    </select>
    
    <hr>
    <!-- Aqui insira o formulário de massa e cola que você já criou, com JS de cálculo em tempo real -->
    
    <button type="submit">Emitir Orçamento e PDF</button>
</form>

<a href="/orcamentos">Acompanhar orçamentos</a>
</body>
</html>

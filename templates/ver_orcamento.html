<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Orçamento #{{ orc[0] }}</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; max-width: 900px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; }
    th { background-color: #f2f2f2; text-align: left; }
    a.voltar { display:inline-block; margin-top:20px; color:#007bff; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Orçamento #{{ orc[0] }}</h2>
    <p><strong>Cliente:</strong> {{ orc[2] }} ({{ orc[3] }})</p>
    <p><strong>Status:</strong> {{ orc[5] }}</p>
    <p><strong>Total Geral:</strong> R$ {{ "%.2f"|format(orc[6]) }}</p>

    <hr>
    <h3>Camadas de Massa</h3>
    <table>
      <tr><th>Tipo</th><th>Metragem</th><th>Espessura</th><th>Densidade</th><th>Preço</th></tr>
      {% for m in massas %}
      <tr>
        <td>{{ m[2] }}</td><td>{{ m[3] }}</td><td>{{ m[4] }}</td><td>{{ m[5] }}</td><td>R$ {{ "%.2f"|format(m[6]) }}</td>
      </tr>
      {% endfor %}
    </table>

    <a href="/" class="voltar">← Voltar</a>
  </div>
</body>
</html>

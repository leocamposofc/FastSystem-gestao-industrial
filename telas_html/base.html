<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Camp's serviços{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007bff;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        header img {
            height: 50px;
        }
        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 12px;
            background-color: #0056b3;
            border-radius: 5px;
            transition: background 0.2s;
        }
        header a:hover {
            background-color: #003f7f;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }
        footer {
            background: #eceff1;
            color: #37474f;
            text-align: center;
            padding: 10px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <!-- Logo da empresa -->
    <img src="{{ url_for('midias', filename='logo.jpeg') }}" alt="Logo da Empresa">

    <!-- Botão voltar para início -->
    <a href="{{ url_for('inicio') }}">Início</a>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    © 2025 camps servicos - Todos os direitos reservados.
</footer>

</body>
</html>
